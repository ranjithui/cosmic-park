# ============================================================
# Cosmic Park — Render Blueprint
#
# Three resources, one deploy:
#   cosmic-park-db   Managed PostgreSQL
#   cosmic-park-api  Express + Prisma (also serves /admin and /uploads)
#   cosmic-park-web  Vite/React static SPA on Render's CDN
#
# First-time setup:  Render Dashboard → New → Blueprint → pick this repo.
# See DEPLOY.md for the post-deploy seed step and free-tier caveats.
# ============================================================

databases:
  - name: cosmic-park-db
    databaseName: cosmic_park
    user: cosmic_park
    plan: free
    region: singapore

services:
  # ----------------------------------------------------------
  # Booking API — long-running Node process. This is deliberately
  # NOT serverless: src/utils/holdCleanup.js runs a node-cron job
  # to release expired holds, and multer writes uploads to disk.
  # ----------------------------------------------------------
  - type: web
    name: cosmic-park-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    # migrate deploy (not `migrate dev`) — applies committed migrations,
    # never prompts, never generates new ones. Safe to re-run per deploy.
    # The seed is idempotent (upserts + match-on-name for rate plans), so
    # it runs every build and the demo data is never missing.
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cosmic-park-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a 256-bit value on first deploy
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: HOLD_DURATION_MINUTES
        value: "15"
      - key: DEFAULT_CURRENCY
        value: INR
      - key: DEFAULT_GST_PERCENT
        value: "18"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "25"

  # ----------------------------------------------------------
  # Marketing site + booking flow — static build, CDN-served,
  # never sleeps (unlike the free web service above).
  # ----------------------------------------------------------
  - type: web
    name: cosmic-park-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Must be the PUBLIC origin, spelled out. Do not switch this to
      # `fromService: property: host` — that resolves to the internal
      # private-network name ("cosmic-park-api", no domain), which the
      # browser cannot reach. Private networking is server-to-server;
      # this value ships to the client.
      #
      # Vite inlines it at BUILD time, so if the API is ever renamed,
      # rebuild this service — restarting will not pick up the change.
      - key: VITE_API_BASE_URL
        value: https://cosmic-park-api.onrender.com
    routes:
      # React Router uses browser history — every deep link (/rooms, /booking)
      # must fall through to index.html or the CDN returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
